[workspace]
resolver = "2"
members = [
    "crates/autoline-core",
    "crates/autolined",
    "crates/autoline-cli",
    "crates/autoline-cmd-wrap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Autoline Contributors"]
license = "MIT"
repository = "https://github.com/user/autoline"
description = "Local-first, cross-shell inline autocomplete for terminal commands and AI prompts"
keywords = ["terminal", "autocomplete", "shell", "cli", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.1"
rusqlite = { version = "0.31", features = ["bundled"] }
nucleo = "0.5"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bincode = "1.3"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
ulid = "1.0"
thiserror = "1.0"
anyhow = "1.0"
serde_json = "1.0"
dirs = "5.0"
tempfile = "3.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
