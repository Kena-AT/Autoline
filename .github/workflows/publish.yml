name: Publish

on:
  push:
    tags: ['v*']

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'v')

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}


  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'v')

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish to npm
        run: |
          npm version ${{ github.ref_name v9 }}
          npm publish

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'v')

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish to PyPI
        run: |
          pip install twine
          python -m twine upload dist/*wheel*