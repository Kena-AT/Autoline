name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            rust: 1.70
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            rust: 1.70
            target: aarch64-apple-darwin
          - os: windows-latest
            rust: 1.70
            target: x86_64-pc-windows-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cache Cargo build
        uses: actions-rs/cache@v2
        with:
          key: cargo-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-build-${{ runner.os }}-

      - name: Cache test results
        uses: actions-rs/cache@v2
        with:
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo test
        run: cargo test --workspace --profile=cc


      - name: Cargo check
        run: cargo check --all-targets


      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -Dwarnings


      - name: Cargo fmt check
        run: cargo fmt --check


  build:
    name: Build on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --release
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --release
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            args: --release

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo build (release)
        run: cargo build --release ${{ matrix.args }}


      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: autolined-${{ runner.os }}-${{ matrix.target }}
          path: target/release/autolined

  publish:
    name: Publish to crates.io
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Publish crate
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
