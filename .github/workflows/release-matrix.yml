name: Release Matrix

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x86_64, aarch64, armv7l]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/setup-rust@v1
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions-rs/cache@v2
        with:
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo build
        uses: actions-rs/cache@v2
        with:
          key: cargo-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autolined-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release/autolined

  publish:
    name: Create GitHub Release
    needs: build
    if: github.ref_name starts_with 'v'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ github.ref_name }}"
          files: |
            **/target/release/autolined*
          generate_release_notes: true